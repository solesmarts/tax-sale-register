name: Update Ontario tax sale listings

on:
  schedule:
    # Every Saturday at 10:00 UTC — a few hours after that week's
    # Gazette issue is typically published.
    - cron: '0 10 * * 6'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape_ontario_tax_sales.py --out listings.json

      - name: Commit updated listings.json
        run: |
          git config user.name "tax-sale-bot"
          git config user.email "actions@github.com"
          git add listings.json
          git diff --quiet --cached || git commit -m "Update listings $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
